<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma4Creators</title>
<style>
:root{--accent:#27ae60;--top:#219653;--bg:#f5f7f5;--panel:#fff;--text:#18221b;--muted:#748078;--line:#e3e9e4;--button:#27ae60;--buttonText:#fff;--soft:#edf7f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}header{height:64px;background:var(--top);color:white;display:flex;align-items:center;padding:0 26px;gap:14px;box-shadow:0 2px 12px #0001}.logo{font-weight:850;font-size:21px;letter-spacing:-.6px}.logo span{opacity:.72}.tag{font-size:11px;border:1px solid #ffffff55;border-radius:20px;padding:4px 8px}.profile-top{margin-left:auto;display:flex;gap:10px;align-items:center}.avatar{background:#ffffff2b;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:700}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:22px 14px;background:var(--panel)}.nav-label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.2px;padding:12px 12px 7px}.nav{width:100%;border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:9px;text-align:left;display:flex;gap:12px;align-items:center;font:600 13px inherit;cursor:pointer;margin:2px 0}.nav .ico{width:20px;text-align:center;font-size:16px}.nav.active{background:var(--soft);color:var(--accent)}.side-bottom{position:sticky;top:calc(100vh - 120px);margin-top:40px;padding:12px;color:var(--muted);font-size:11px}.main{padding:32px clamp(22px,4vw,58px);max-width:1500px;width:100%;margin:0 auto}.eyebrow{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:1.4px;text-transform:uppercase}h1{font-size:30px;line-height:1.2;margin:7px 0 8px;letter-spacing:-.8px}h2{font-size:17px;margin:0 0 15px}.sub{color:var(--muted);margin:0 0 26px}.hero{background:linear-gradient(120deg,#143d2b,#23864d);border-radius:18px;padding:30px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:210px;overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;right:22%;top:-75px;font-size:280px;color:#ffffff0b;pointer-events:none}.hero h2{font-size:27px;margin:8px 0}.hero p{max-width:490px;color:#d7f1df}.hero .mini{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#a7e9bd;font-weight:800}.hero-art{font-size:90px;filter:drop-shadow(0 12px 12px #0004);padding:0 30px}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--button);color:var(--buttonText);font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:var(--soft);color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px}.card p{color:var(--muted);margin:6px 0 14px}.stat{font-size:23px;font-weight:800}.stat-label{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:27px 0 13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:700}.input,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--text);font:inherit;outline-color:var(--accent)}.search{max-width:340px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;display:flex;flex-direction:column;min-height:170px}.item-top{display:flex;align-items:flex-start;gap:12px}.item-icon{width:42px;height:42px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:23px;flex-shrink:0}.item h3{font-size:14px;margin:1px 0 4px;overflow-wrap:anywhere}.item p{color:var(--muted);font-size:12px;margin:0 0 14px}.item .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-size:10px;border-radius:20px;background:var(--soft);color:var(--accent);padding:4px 8px;font-weight:800}.muted{color:var(--muted)}.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}.settings-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.range-row{display:flex;align-items:center;gap:12px}.range-row input{flex:1;accent-color:var(--accent)}.range-value{font-weight:800;min-width:70px;text-align:right}.theme-picks{display:flex;gap:10px}.theme-pick{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 8px;background:var(--panel);color:var(--text);cursor:pointer}.theme-pick strong{display:block;font-size:12px;margin-top:7px}.swatch{height:28px;border-radius:6px;background:linear-gradient(90deg,#27ae60 50%,#fff 50%);border:1px solid var(--line)}.swatch.light{background:linear-gradient(90deg,#fff 50%,#ddd 50%)}.swatch.dark{background:linear-gradient(90deg,#111 50%,#aaa 50%)}.colorrow{display:grid;grid-template-columns:1fr 58px;gap:8px}.colorrow input[type=color]{width:58px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:3px}.notice{padding:12px 14px;background:var(--soft);color:var(--text);border-radius:9px;font-size:12px;margin:12px 0}.notice b{color:var(--accent)}.toast{position:fixed;bottom:22px;right:22px;background:#17241b;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 5px 20px #0003;z-index:5}.hidden{display:none!important}.server-row,.account-row,.profile-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;margin:9px 0}.grow{flex:1;min-width:0}.server-row small,.account-row small,.profile-row small{display:block;color:var(--muted)}.big-play{font-size:16px;padding:14px 25px}.footer-note{font-size:11px;color:var(--muted);margin-top:28px}
@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.cards,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-art{font-size:65px;padding:0 8px}}@media(max-width:760px){.layout{display:block}aside{display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.nav-label,.side-bottom{display:none}.nav{white-space:nowrap;width:auto;flex-shrink:0}.main{padding:22px 16px}.cards,.grid,.settings-layout{grid-template-columns:1fr}.hero-art{display:none}h1{font-size:26px}}
</style></head><body><header><div class="logo">LUMA<span>4</span>CREATORS</div><span class="tag">COMMUNITY EDITION</span><div class="profile-top"><span id="topAccount">Гость</span><div class="avatar">L</div></div></header><div class="layout"><aside><div class="nav-label">ИГРА</div><button class="nav active" data-page="home"><span class="ico">◈</span>Обзор</button><button class="nav" data-page="play"><span class="ico">▶</span>Играть</button><button class="nav" data-page="accounts"><span class="ico">♙</span>Аккаунты</button><div class="nav-label">КОНТЕНТ</div><button class="nav" data-page="modpacks"><span class="ico">▦</span>Модпаки</button><button class="nav" data-page="mods"><span class="ico">✣</span>Моды</button><button class="nav" data-page="plugins"><span class="ico">⚙</span>Плагины</button><div class="nav-label">ИНСТРУМЕНТЫ</div><button class="nav" data-page="servers"><span class="ico">▤</span>Локальные серверы</button><button class="nav" data-page="settings"><span class="ico">☷</span>Настройки</button><div class="side-bottom">LumaLabs · версия 0.1.0<br>Сделано для создателей.</div></aside><main class="main" id="main"></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={page:'home',theme:localStorage.theme||'normal',accent:localStorage.accent||'#27ae60',top:localStorage.top||'#219653',memory:+localStorage.memory||4,accounts:JSON.parse(localStorage.accounts||'[]'),profiles:JSON.parse(localStorage.profiles||'[]'),servers:JSON.parse(localStorage.servers||'[]'),mods:[],modpacks:[],plugins:[],search:'',version:'1.21.8',loader:'fabric',busy:false};
function save(){for(const k of ['accounts','profiles','servers'])localStorage[k]=JSON.stringify(state[k]);localStorage.theme=state.theme;localStorage.accent=state.accent;localStorage.top=state.top;localStorage.memory=state.memory;}
function applyTheme(){let r=document.documentElement;if(state.theme==='dark'){r.style.setProperty('--bg','#111312');r.style.setProperty('--panel','#1b1e1c');r.style.setProperty('--text','#f1f4f1');r.style.setProperty('--muted','#a0aaa3');r.style.setProperty('--line','#303632');r.style.setProperty('--soft','#29322c');r.style.setProperty('--button','#cbd2cd');r.style.setProperty('--buttonText','#171a18');r.style.setProperty('--top','#111312')}else if(state.theme==='light'){r.style.setProperty('--bg','#fff');r.style.setProperty('--panel','#fff');r.style.setProperty('--text','#222');r.style.setProperty('--muted','#777');r.style.setProperty('--line','#e5e5e5');r.style.setProperty('--soft','#f0f0f0');r.style.setProperty('--button','#d5d8d6');r.style.setProperty('--buttonText','#222');r.style.setProperty('--top','#fff');}else{r.style.setProperty('--bg','#f5f7f5');r.style.setProperty('--panel','#fff');r.style.setProperty('--text','#18221b');r.style.setProperty('--muted','#748078');r.style.setProperty('--line','#e3e9e4');r.style.setProperty('--soft','#edf7f0');r.style.setProperty('--button',state.accent);r.style.setProperty('--buttonText','#fff');r.style.setProperty('--top',state.top)}r.style.setProperty('--accent',state.accent);if(state.theme==='light')r.style.setProperty('--accent',state.accent);}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
function go(p){state.page=p;state.search='';$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function heading(k,t,s){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p class="sub">${s}</p>`}
function render(){applyTheme();$('#topAccount').textContent=state.accounts[0]?.name||'Гость';let m=$('#main');const pages={home:home,play:play,accounts:accounts,modpacks:()=>catalog('modpacks'),mods:()=>catalog('mods'),plugins:()=>catalog('plugins'),servers:servers,settings:settings};m.innerHTML=(pages[state.page]||home)();wire();}
function home(){return `${heading('РАДЫ ВИДЕТЬ','Твоя следующая история начинается здесь.','Управляй Minecraft, находи контент и собирай собственные сборки в одном месте.')}<section class="hero"><div><div class="mini">LUMA4CREATORS LAUNCHER</div><h2>Build your own world.</h2><p>Модпаки, моды и инструменты для создателей. Настрой лаунчер под себя и начни собирать свой Minecraft.</p><div class="row"><button class="btn" data-go="play">▶ &nbsp; Перейти к игре</button><button class="btn secondary" data-go="modpacks">Найти модпак</button></div></div><div class="hero-art">⛏️</div></section><div class="grid"><div class="card"><div class="stat">${state.profiles.length}</div><div class="stat-label">Собственных профилей</div></div><div class="card"><div class="stat">${state.servers.length}</div><div class="stat-label">Локальных серверов</div></div><div class="card"><div class="stat">${state.accounts.length}</div><div class="stat-label">Добавленных аккаунтов</div></div></div><div class="section-head"><h2>Быстрый доступ</h2></div><div class="cards"><div class="item"><div class="item-top"><div class="item-icon">🧩</div><div><h3>Модпаки</h3><p>Найди сборку в Modrinth</p></div></div><div class="foot"><span class="pill">MODRINTH</span><button class="btn ghost" data-go="modpacks">Открыть →</button></div></div><div class="item"><div class="item-top"><div class="item-icon">🖥️</div><div><h3>Локальный сервер</h3><p>Создай сервер на своём устройстве</p></div></div><div class="foot"><span class="pill">LOCAL</span><button class="btn ghost" data-go="servers">Создать →</button></div></div><div class="item"><div class="item-top"><div class="item-icon">🎨</div><div><h3>Персонализация</h3><p>Темы и цвета RGB / HEX</p></div></div><div class="foot"><span class="pill">CUSTOM</span><button class="btn ghost" data-go="settings">Настроить →</button></div></div></div><p class="footer-note">Прототип интерфейса. Реальный запуск Minecraft и создание серверов требуют подключения игрового ядра — см. README.</p>`}
function play(){return `${heading('МОЯ ИГРА','Играть','Выбери версию Minecraft или создай отдельный профиль для своей сборки.')}<div class="card"><h2>Быстрый запуск</h2><div class="settings-layout"><div class="field"><label>Версия Minecraft</label><select id="gameVersion">${['1.21.8','1.21.7','1.21.6','1.21.5','1.21.4','1.20.6','1.20.4','1.20.1','1.19.4','1.18.2','1.16.5','1.12.2','Latest release','Latest snapshot'].map(v=>`<option ${state.version===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Загрузчик</label><select id="loader"><option value="vanilla" ${state.loader==='vanilla'?'selected':''}>Vanilla</option><option value="fabric" ${state.loader==='fabric'?'selected':''}>Fabric</option><option value="forge" ${state.loader==='forge'?'selected':''}>Forge</option><option value="neoforge" ${state.loader==='neoforge'?'selected':''}>NeoForge</option><option value="quilt" ${state.loader==='quilt'?'selected':''}>Quilt</option></select></div></div><div class="row"><button class="btn big-play" id="launchBtn">▶ &nbsp; Играть</button><button class="btn secondary" data-action="createProfile">＋ Создать профиль</button></div><div class="notice">Реальный запуск подключён для Vanilla в офлайн-режиме: лаунчер скачает необходимые игровые файлы при первом запуске. Для Microsoft-аккаунта и модлоадеров требуется следующий этап разработки.</div></div><div class="section-head"><h2>Мои профили</h2><span class="pill">${state.profiles.length} ПРОФИЛЕЙ</span></div>${state.profiles.length?state.profiles.map((p,i)=>`<div class="profile-row"><div class="item-icon">⛏</div><div class="grow"><b>${esc(p.name)}</b><small>Minecraft ${esc(p.version)} · ${esc(p.loader)}</small></div><button class="btn ghost" data-profile="${i}">Выбрать</button><button class="btn secondary" data-delete-profile="${i}">Удалить</button></div>`).join(''):'<div class="empty">Пока нет профилей. Создай профиль, чтобы организовать отдельную сборку.</div>'}`}
function accounts(){return `${heading('УЧЁТНЫЕ ЗАПИСИ','Аккаунты','Добавляй поддерживаемые типы учётных записей. Пароли не сохраняются этим прототипом.')}<div class="cards"><div class="item"><div class="item-top"><div class="item-icon">🟩</div><div><h3>Локальный аккаунт</h3><p>Для офлайн-режима. Не подтверждает владение Minecraft.</p></div></div><div class="foot"><span class="pill">OFFLINE</span><button class="btn" data-account="offline">Добавить</button></div></div><div class="item"><div class="item-top"><div class="item-icon">🪟</div><div><h3>Microsoft</h3><p>Официальная авторизация для лицензии Minecraft.</p></div></div><div class="foot"><span class="pill">OFFICIAL</span><button class="btn" data-account="microsoft">Подключить</button></div></div><div class="item"><div class="item-top"><div class="item-icon">🔷</div><div><h3>Ely.by</h3><p>Вход через сторонний сервис аккаунтов.</p></div></div><div class="foot"><span class="pill">ELY.BY</span><button class="btn" data-account="elyby">Подключить</button></div></div></div><div class="section-head"><h2>Добавленные аккаунты</h2></div>${state.accounts.length?state.accounts.map((a,i)=>`<div class="account-row"><div class="avatar" style="background:var(--soft);color:var(--accent)">${esc(a.name.slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(a.name)}</b><small>${esc(a.typeLabel)} · ${a.type==='offline'?'Офлайн-профиль':a.type==='microsoft'?'Не авторизован в этом прототипе':'Не авторизован в этом прототипе'}</small></div><button class="btn secondary" data-delete-account="${i}">Удалить</button></div>`).join(''):'<div class="empty">Аккаунты ещё не добавлены.</div>'}<div class="notice">Офлайн-аккаунт работает для локального запуска и не подтверждает лицензию. Microsoft и Ely.by пока не подключены — не вводи пароли на сторонних страницах, пока OAuth не будет реализован.</div>`}
function catalog(kind){let title=kind==='mods'?'Моды':kind==='modpacks'?'Модпаки':'Плагины';let data=state[kind];return `${heading('БИБЛИОТЕКА MODRINTH',title,`Поиск проектов в каталоге Modrinth. Выбирай версию Minecraft и смотри описание проекта.`)}<div class="row" style="margin-bottom:18px"><input class="input search" id="catalogSearch" placeholder="Поиск ${title.toLowerCase()}…" value="${esc(state.search)}"><select id="catalogVersion" style="max-width:150px"><option>1.21.8</option><option>1.21.5</option><option>1.21.4</option><option>1.20.1</option><option>1.19.2</option><option>Все версии</option></select><button class="btn" id="searchBtn">Найти</button></div><div class="notice">Источник: <b>Modrinth</b>. Каталог позволяет искать проекты и открывать их страницы. Установка модов и импорт .mrpack будут добавлены отдельным этапом.</div><div id="catalogResults">${data.length?renderItems(data,kind):'<div class="empty">Введи запрос и нажми «Найти», чтобы загрузить проекты из Modrinth.</div>'}</div>`}
function renderItems(data,kind){return `<div class="cards">${data.map((x,i)=>`<div class="item"><div class="item-top"><div class="item-icon">${kind==='mods'?'🧩':kind==='modpacks'?'📦':'🔌'}</div><div><h3>${esc(x.title||x.slug||'Без названия')}</h3><p>${esc((x.description||'Описание не указано').slice(0,125))}${(x.description||'').length>125?'…':''}</p></div></div><div class="foot"><span class="pill">⬇ ${(x.downloads||0).toLocaleString('ru-RU')}</span><button class="btn ghost" data-project="${i}" data-kind="${kind}">Подробнее</button></div></div>`).join('')}</div>`}
function servers(){return `${heading('СВОЯ ИНФРАСТРУКТУРА','Локальные серверы','Создавай несколько серверных профилей на своём компьютере и управляй настройками каждого.')}<div class="card"><h2>Новый сервер</h2><div class="settings-layout"><div class="field"><label>Название</label><input id="serverName" class="input" placeholder="Например, Luma SMP"></div><div class="field"><label>Версия Minecraft</label><select id="serverVersion">${['1.21.8','1.21.5','1.21.4','1.20.1','1.19.2','1.18.2','1.16.5'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="field"><label>Ядро сервера</label><select id="serverCore"><option>Vanilla</option><option>Paper</option><option>Fabric</option><option>Forge</option><option>NeoForge</option><option>Purpur</option></select></div><div class="field"><label>Память сервера (GB)</label><select id="serverRam"><option>2</option><option>4</option><option>6</option><option>8</option><option>12</option></select></div></div><div class="field"><label>Плагины (названия через запятую, для Paper/Purpur)</label><input id="serverPlugins" class="input" placeholder="EssentialsX, LuckPerms"></div><button class="btn" data-action="createServer">＋ Создать серверный профиль</button><div class="notice">Это пока сохранение конфигурации, а не запуск настоящего сервера. Для полноценного создания потребуется загрузка server.jar, согласие с EULA и управление процессом.</div></div><div class="section-head"><h2>Мои серверы</h2><span class="pill">${state.servers.length} СОХРАНЕНО</span></div>${state.servers.length?state.servers.map((s,i)=>`<div class="server-row"><div class="item-icon">🖥️</div><div class="grow"><b>${esc(s.name)}</b><small>${esc(s.version)} · ${esc(s.core)} · ${s.ram} GB RAM · ${s.plugins.length} плагинов</small></div><span class="pill">ПРОФИЛЬ</span><button class="btn secondary" data-delete-server="${i}">Удалить</button></div>`).join(''):'<div class="empty">Пока нет серверов. Создай первый профиль выше.</div>'}`}
function settings(){return `${heading('ПЕРСОНАЛИЗАЦИЯ','Настройки','Настрой внешний вид и ресурсы под свой компьютер.')}<div class="settings-layout"><div class="card"><h2>Внешний вид</h2><div class="field"><label>Готовая тема</label><div class="theme-picks"><button class="theme-pick" data-theme="normal"><div class="swatch"></div><strong>Обычная</strong></button><button class="theme-pick" data-theme="light"><div class="swatch light"></div><strong>Светлая</strong></button><button class="theme-pick" data-theme="dark"><div class="swatch dark"></div><strong>Тёмная</strong></button></div></div><div class="field"><label>Основной цвет (HEX / RGB-палитра)</label><div class="colorrow"><input id="accentHex" class="input" value="${esc(state.accent)}" placeholder="#27AE60"><input id="accentColor" type="color" value="${esc(state.accent)}"></div></div><div class="field"><label>Цвет верхней панели</label><div class="colorrow"><input id="topHex" class="input" value="${esc(state.top)}"><input id="topColor" type="color" value="${esc(state.top)}"></div></div><button class="btn" data-action="saveTheme">Сохранить оформление</button></div><div class="card"><h2>Память Minecraft</h2><p>Выделяемая оперативная память для игры.</p><div class="range-row"><input id="memoryRange" type="range" min="1" max="32" value="${state.memory}"><span class="range-value" id="memoryLabel">${state.memory} GB</span></div><div class="field" style="margin-top:18px"><label>Аргументы JVM (будущий запуск)</label><input class="input" value="-XX:+UseG1GC -XX:+UnlockExperimentalVMOptions" id="jvmArgs"></div><div class="field"><label>Папка игры</label><button class="btn secondary" id="openGameFolder" type="button">Открыть папку Minecraft</button></div><div class="notice">Объём RAM применяется при запуске Vanilla. Не выделяй всю память компьютера: Windows и другие программы тоже её используют.</div></div><div class="card"><h2>Общие настройки</h2><div class="field"><label>Язык</label><select><option>Русский</option><option>English (coming soon)</option></select></div><div class="field"><label>Проверка обновлений</label><select><option>Автоматически</option><option>Вручную</option></select></div><label style="display:flex;gap:9px;align-items:center;margin:12px 0"><input type="checkbox" checked> Показывать уведомления</label><label style="display:flex;gap:9px;align-items:center;margin:12px 0"><input type="checkbox"> Закрывать лаунчер при запуске игры</label><button class="btn secondary" data-action="resetSettings">Сбросить настройки</button></div><div class="card"><h2>О лаунчере</h2><div class="stat">0.1.0</div><p>Ранний прототип Luma4Creators</p><p>Каталог модов: Modrinth API</p><p>Разработчик: LumaLabs</p><span class="pill">DESKTOP PREVIEW</span></div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wire(){ $$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$$('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();render()});
$('#memoryRange')?.addEventListener('input',e=>{state.memory=+e.target.value;$('#memoryLabel').textContent=state.memory+' GB';save()});
[['accentHex','accentColor','accent'],['topHex','topColor','top']].forEach(([a,b,k])=>{let x=$('#'+a),y=$('#'+b);if(x&&y){x.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(x.value)){y.value=x.value;state[k]=x.value;applyTheme()}};y.oninput=()=>{x.value=y.value;state[k]=y.value;applyTheme()}}});
$$('[data-account]').forEach(b=>b.onclick=()=>{let type=b.dataset.account;if(type==='microsoft'||type==='elyby'){toast('Авторизация '+(type==='microsoft'?'Microsoft':'Ely.by')+' появится после подключения OAuth.');return}let name=prompt('Имя локального игрока:','Player');if(!name)return;if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){toast('Ник должен содержать 3–16 латинских букв, цифр или _.');return}state.accounts.push({name,type,typeLabel:'Локальный'});save();render()});
$$('[data-delete-account]').forEach(b=>b.onclick=()=>{state.accounts.splice(+b.dataset.deleteAccount,1);save();render()});
$$('[data-action="createProfile"]').forEach(b=>b.onclick=()=>{let name=prompt('Название профиля:','Моя сборка');if(!name)return;state.profiles.push({name,version:state.version,loader:state.loader});save();render();toast('Профиль сохранён')});
$('#gameVersion')?.addEventListener('change',e=>state.version=e.target.value);$('#loader')?.addEventListener('change',e=>state.loader=e.target.value);$('#launchBtn')?.addEventListener('click',async()=>{let account=state.accounts.find(a=>a.type==='offline');let username=account?.name||prompt('Ник для офлайн-запуска Minecraft (3–16 символов):','Player');if(!username)return;if(!/^[A-Za-z0-9_]{3,16}$/.test(username)){toast('Ник должен содержать 3–16 латинских букв, цифр или _.');return}if(!account){state.accounts.push({name:username,type:'offline',typeLabel:'Локальный'});save()}let btn=$('#launchBtn');btn.disabled=true;btn.textContent='Подготовка Minecraft…';try{let result=await window.lumaApp.launch({username,version:$('#gameVersion').value,memory:state.memory,loader:$('#loader').value});toast(result.message||'Запуск начат')}catch(e){toast(e.message||'Не удалось запустить Minecraft')}finally{if($('#launchBtn')){btn.disabled=false;btn.innerHTML='▶ &nbsp; Играть'}}});
$$('[data-profile]').forEach(b=>b.onclick=()=>{let p=state.profiles[+b.dataset.profile];state.version=p.version;state.loader=p.loader;toast('Выбран профиль: '+p.name);render()});$$('[data-delete-profile]').forEach(b=>b.onclick=()=>{state.profiles.splice(+b.dataset.deleteProfile,1);save();render()});
$$('[data-action="createServer"]').forEach(b=>b.onclick=()=>{let name=$('#serverName').value.trim();if(!name){toast('Укажи название сервера');return}state.servers.push({name,version:$('#serverVersion').value,core:$('#serverCore').value,ram:$('#serverRam').value,plugins:$('#serverPlugins').value.split(',').map(x=>x.trim()).filter(Boolean)});save();render();toast('Профиль сервера сохранён')});$$('[data-delete-server]').forEach(b=>b.onclick=()=>{state.servers.splice(+b.dataset.deleteServer,1);save();render()});
$$('[data-action="saveTheme"]').forEach(b=>b.onclick=()=>{let a=$('#accentHex').value,t=$('#topHex').value;if(!/^#[0-9a-f]{6}$/i.test(a)||!/^#[0-9a-f]{6}$/i.test(t)){toast('Используй HEX-цвета формата #RRGGBB');return}state.accent=a;state.top=t;save();render();toast('Оформление сохранено')});$$('[data-action="resetSettings"]').forEach(b=>b.onclick=()=>{state.theme='normal';state.accent='#27ae60';state.top='#219653';state.memory=4;save();render();toast('Настройки сброшены')});
$('#openGameFolder')?.addEventListener('click',async()=>{try{await window.lumaApp.openGameFolder()}catch(e){toast('Не удалось открыть папку')}});$('#searchBtn')?.addEventListener('click',()=>searchCatalog());$('#catalogSearch')?.addEventListener('keydown',e=>{if(e.key==='Enter')searchCatalog()});
$$('[data-project]').forEach(b=>b.onclick=()=>{let p=state[b.dataset.kind][+b.dataset.project];alert(`${p.title||p.slug}\n\n${p.description||'Описание отсутствует'}\n\nModrinth ID: ${p.project_id||p.id||'—'}\nЗагрузок: ${(p.downloads||0).toLocaleString('ru-RU')}\n\nУстановка будет добавлена в будущей версии.`)});
}
async function searchCatalog(){let kind=state.page,q=$('#catalogSearch').value.trim(),ver=$('#catalogVersion').value;state.search=q;let el=$('#catalogResults');if(!q){el.innerHTML='<div class="empty">Введи название или ключевые слова для поиска.</div>';return}el.innerHTML='<div class="empty">Загружаю проекты Modrinth…</div>';let facets=kind==='mods'?'["project_type:mod"]':kind==='modpacks'?'["project_type:modpack"]':'["project_type:plugin"]';if(ver!=='Все версии')facets=facets.slice(0,-1)+',"versions:'+ver+'"]';try{let url='https://api.modrinth.com/v2/search?query='+encodeURIComponent(q)+'&facets='+encodeURIComponent('['+facets+']')+'&limit=18';let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();state[kind]=d.hits||[];el.innerHTML=state[kind].length?renderItems(state[kind],kind):'<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>';wire()}catch(e){el.innerHTML='<div class="empty">Не удалось подключиться к Modrinth. Проверь интернет и попробуй снова.<br><small>'+esc(e.message)+'</small></div>'}}
window.lumaApp?.onStatus?.(event=>{if(event.type==='error')toast('Ошибка запуска: '+event.message.slice(0,180));});
render();
</script></body></html>
